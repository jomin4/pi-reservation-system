# mobile CI — 정적 검사만
#
#   근거   docs/deploy.md §8.1 · docs/tech.md §버전 고정
#   러너   GitHub-hosted
#
# ⚠️ CI 에서 앱을 빌드하지 않는다.
#    eas build --local 이나 expo prebuild 는 Android SDK + Gradle 이 필요해
#    10분 이상 걸리고 PR 마다 돌릴 값이 없다.
#    expo-doctor 가 설정 불일치를 대신 잡는다.

name: mobile-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  check:
    name: mobile · 타입 · 린트 · expo-doctor
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      # ⚠️ 트랙이 스캐폴드되기 전에도 이 job 은 돈다.
      #    특히 contract 조건 때문에 모바일과 무관한 계약 PR 에서도 돈다 —
      #    docs/api/openapi.yaml 만 고친 PR 이 mobile/pnpm-lock.yaml 이 없어
      #    아래 setup-node 의 cache-dependency-path 부터 깨진다.
      #    건너뛴 단계는 성공으로 보고되므로 필수 체크로 두어도 안전하다.
      #
      #    ⚠️ 이 가드는 지우는 게 아니라 저절로 풀린다.
      #       mobile/package.json 이 커밋되는 순간 ready=true 가 된다.
      - name: 스캐폴드 여부
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'mobile/package.json 이 없다. 아직 스캐폴드 전이므로 이후 단계를 건너뛴다.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.scaffold.outputs.ready == 'true'

      - name: tsc --noEmit
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm exec tsc --noEmit

      - name: lint
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run lint

      - name: test
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run --if-present test

      # ⚠️ CI 가 앱을 안 빌드하는 대가를 이 단계가 치른다.
      #    app.json · 의존성 버전 · Expo SDK 정합성을 여기서 본다.
      - name: expo-doctor
        if: steps.scaffold.outputs.ready == 'true'
        run: npx --yes expo-doctor@latest

      # ⚠️ 계약 선행 규칙(workflow.md §3)의 집행 장치다.
      #    계약이 바뀌었는데 타입을 재생성 안 했으면 여기서 잡힌다.
      #    contract 가 바뀌기만 해도 이 job 이 도는 이유가 이것이다.
      - name: 생성 타입 최신성
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npx --yes openapi-typescript@7 ../docs/api/openapi.yaml -o /tmp/api.d.ts
          if ! diff -u /tmp/api.d.ts src/api/schema.d.ts; then
            echo
            echo '계약이 바뀌었는데 생성 타입이 낡았다. 아래를 돌리고 커밋한다.'
            echo '  npx openapi-typescript ../docs/api/openapi.yaml -o src/api/schema.d.ts'
            exit 1
          fi

  notify:
    needs: check
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/_notify.yml
    with:
      track: mobile
      phase: CI
      result: failure
    secrets:
      webhook: ${{ secrets.DISCORD_WEBHOOK_CI }}
