# front CI
#
#   근거   docs/deploy.md §7
#   러너   GitHub-hosted
#
# ⚠️ front CD 는 없다. Cloudflare Pages 가 한다.
#    그래서 이 파일은 "Pages 가 안 하는 것" 만 한다.
#
#    Pages 는 vite build 를 돌리는데 vite build 는 타입 체크를 하지 않는다.
#    Pages 빌드가 통과해도 타입 에러가 프로덕션에 나갈 수 있다 —
#    tsc --noEmit 이 이 워크플로의 존재 이유다.

name: front-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  check:
    # ⚠️ 이 `name` 은 develop 브랜치 보호의 **필수 체크 이름과 글자까지 같아야 한다.**
    #    바꾸면 그 이름의 체크가 영영 안 와서 모든 PR 이 BLOCKED 로 멈춘다 —
    #    검사는 전부 초록인데 머지만 안 되므로 원인이 안 보인다.
    #    단계를 추가할 때 이름에 덧붙이고 싶어지지만, 그게 이 함정이다.
    name: front · 타입 · 린트 · 테스트
    needs: changes
    if: needs.changes.outputs.front == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5

      # ⚠️ 트랙이 스캐폴드되기 전에도 이 job 은 돈다.
      #    _changes 는 '^front/' 로 판별하므로 front/CLAUDE.md 한 줄만
      #    고쳐도 front=true 가 된다. package.json 이 없으면 바로 아래
      #    setup-node 의 cache-dependency-path 부터 깨진다.
      #    건너뛴 단계는 성공으로 보고되므로 필수 체크로 두어도 안전하다.
      - name: 스캐폴드 여부
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'front/package.json 이 없다. 아직 스캐폴드 전이므로 이후 단계를 건너뛴다.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.scaffold.outputs.ready == 'true'

      # ⚠️ 이 워크플로의 존재 이유. vite build 는 여기를 통과시킨다.
      - name: tsc --noEmit
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm exec tsc --noEmit

      - name: lint
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run lint

      - name: test
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run --if-present test

      # ⚠️ 계약 선행 규칙(workflow.md §3)의 집행 장치다.
      #    계약이 바뀌었는데 타입을 재생성 안 했으면 여기서 잡힌다.
      #    contract 가 바뀌기만 해도 이 job 이 도는 이유가 이것이다.
      - name: 생성 타입 최신성
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npx --yes openapi-typescript@7 ../docs/api/openapi.yaml -o /tmp/api.d.ts
          if ! diff -u /tmp/api.d.ts src/api/schema.d.ts; then
            echo
            echo '계약이 바뀌었는데 생성 타입이 낡았다. 아래를 돌리고 커밋한다.'
            echo '  npx openapi-typescript ../docs/api/openapi.yaml -o src/api/schema.d.ts'
            exit 1
          fi

      # ⚠️ 목이 프로덕션 번들에 실려 나간 적이 있다 (#108).
      #    VITE_API_MODE 검사는 런타임 가드라 트리셰이킹을 못 한다 —
      #    src/mocks/ 를 정적으로 import 하면 가짜 예약 데이터가 엔트리 청크에 들어간다.
      #
      #    이 단계가 vite build 를 처음으로 CI 안에서 돌린다. 빌드 자체가 깨지는 것도
      #    여기서 잡힌다 — 그전까지는 Cloudflare Pages 가 배포 시점에 처음 알았다.
      - name: 번들에 목이 없다
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run check:bundle

  notify:
    needs: check
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/_notify.yml
    with:
      track: front
      phase: CI
      result: failure
    secrets:
      webhook: ${{ secrets.DISCORD_WEBHOOK_CI }}
