# redocly lint 설정 — 끈 규칙은 반드시 이유를 남긴다
#
# 실행:  npx @redocly/cli lint docs/api/openapi.yaml
# 근거:  api.md 부록 A.4
#
# ⚠️ 저장소 루트에 두는 이유: redocly 는 설정 파일을 실행 디렉터리에서
#    위로 올라가며 찾는다. docs/api/ 에 두면 CI(루트 실행)가 못 읽어
#    끈 규칙이 조용히 되살아난다.

# ⚠️ `apis:` 를 쓰지 않는다. openapi-typescript 가 같은 파일을 읽는데,
#    `apis:` 가 있으면 CLI 인자를 무시하고 `x-openapi-ts.output` 을 요구한다.
#    출력 경로는 front / mobile 이 각자 정해야 하므로 여기서 못 박지 않는다.

rules:
  # 포트폴리오 저장소다. 배포용 패키지가 아니라 라이선스 필드가 의미 없다.
  info-license: off

  # localhost 서버는 의도적이다. MSW 대신 실제 백엔드에 붙여볼 때,
  # 그리고 SpringDoc 산출 스펙과 diff 할 때(A.4) 쓰는 항목이다.
  no-server-example.com: off

  # GET /stations 에는 4xx 가 없는 게 맞다.
  # 파라미터가 없어서 400 이 없고, 시드 데이터라 404 도 없다.
  # 억지로 4xx 를 적으면 "일어나지 않는 응답" 이 계약에 들어간다.
  operation-4xx-response: off
