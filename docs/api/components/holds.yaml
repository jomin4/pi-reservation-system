# §5.2 선점 — 이 프로젝트의 심장
# 근거: api.md §5.2 · §4.2 · §4.7 · data.md §4 · §5.1 (TS-1·TS-2) · §5.2 (SH-1·SH-3) · ADR-0002

schemas:

  # ── 좌석 주소 ──────────────────────────────────────────────
  SeatAddress:
    type: object
    description: '좌석 주소 **호차-행-열** (`data.md` §1). 예 `4호차 7A`'
    required: [carNo, rowNo, colLetter]
    properties:
      carNo:
        type: integer
        minimum: 1
        maximum: 10
      rowNo:
        type: integer
        minimum: 1
        maximum: 20
      colLetter:
        type: string
        pattern: '^[A-D]$'
    example: { carNo: 4, rowNo: 7, colLetter: A }

  HoldId:
    type: string
    description: |
      선점 식별자. **불투명 문자열이다** — 내부 `seat_hold.id` 가 아니다 (`api.md` §3).
      형식을 파싱하거나 증감시키지 말 것.
    example: h_8f3a21

  # ── 요청 ───────────────────────────────────────────────────
  HoldRequest:
    type: object
    required: [tripId, seats]
    properties:
      tripId:
        type: integer
        format: int64
        example: 101
      seats:
        type: array
        description: |
          ⚠️ **전부 성공하거나 전부 실패한다** (`F-04` · ADR-0002).
          한 좌석이라도 잡히면 나머지도 잡히지 않는다 — 부분 성공은 없다.
        minItems: 1
        maxItems: 6
        items:
          $ref: '#/schemas/SeatAddress'
    example:
      tripId: 101
      seats:
        - { carNo: 4, rowNo: 7, colLetter: A }
        - { carNo: 4, rowNo: 7, colLetter: B }

  # ── 응답 ───────────────────────────────────────────────────
  HoldResponse:
    type: object
    description: '`POST /holds` 와 `GET /holds/{holdId}` 가 **같은 형태**를 준다'
    required: [holdId, tripId, seats, expiresAt, remainingSeconds, totalFare]
    properties:
      holdId:
        $ref: '#/schemas/HoldId'
      tripId:
        type: integer
        format: int64
      seats:
        type: array
        minItems: 1
        maxItems: 6
        items:
          $ref: '#/schemas/SeatAddress'
      expiresAt:
        type: string
        format: date-time
        description: |
          선점 만료 시각 (생성 + 10분).
          ⚠️ **타이머는 이 값에서 역산한다.** 인터벌 카운트로 만들면
          **모바일 백그라운드에서 멈춘다** (`E-04`).
      remainingSeconds:
        type: integer
        minimum: 0
        description: |
          남은 초. **시계 오차를 잡는 보조값**이지 타이머의 근거가 아니다.
        example: 600
      totalFare:
        type: integer
        description: 선택한 좌석 수 × 1인 운임 (원)
        example: 119600
    example:
      holdId: h_8f3a21
      tripId: 101
      seats:
        - { carNo: 4, rowNo: 7, colLetter: A }
        - { carNo: 4, rowNo: 7, colLetter: B }
      expiresAt: '2026-09-04T05:22:33Z'
      remainingSeconds: 600
      totalFare: 119600

  # ── 409 ────────────────────────────────────────────────────
  SeatFailureReason:
    type: string
    description: |
      **`ALL_OR_NOTHING` 이 이 프로젝트의 계약을 드러내는 값이다.**
      "이 좌석 자체는 멀쩡한데 **같이 고른 좌석 때문에 함께 실패했다**" 는 뜻이다.
      `E-01` 의 "함께 선택한 7A도 선점되지 않았습니다" 문구가 여기서 나온다.
    enum:
      - HELD_BY_OTHER
      - ALL_OR_NOTHING

  FailedSeat:
    allOf:
      - $ref: '#/schemas/SeatAddress'
      - type: object
        required: [reason]
        properties:
          reason:
            $ref: '#/schemas/SeatFailureReason'

  SeatConflictProblem:
    description: |
      `409` 두 가지를 **하나의 스키마로** 준다. **`code` 로 분기한다** (`api.md` §4.2).

      | `code` | 뜻 | 화면 |
      |---|---|---|
      | `SEAT_ALREADY_HELD` | 남이 먼저 가졌다 | **다른 좌석을 고르게** |
      | `SEAT_LOCK_TIMEOUT` | 락 대기 200ms 초과 | **다시 시도** |

      ⚠️ **`failedSeats` 는 `SEAT_ALREADY_HELD` 에만 있다.**
      락 타임아웃은 **어느 좌석이 문제인지 서버도 모른다** — 잠그지 못했으니까.
    allOf:
      - $ref: './common.yaml#/schemas/Problem'
      - type: object
        properties:
          failedSeats:
            type: array
            minItems: 1
            maxItems: 6
            items:
              $ref: '#/schemas/FailedSeat'

responses:

  HoldCreated:
    description: '`201` — 선점 성공. 전이 `TS-1` ×N + `SH-1`'
    headers:
      Location:
        description: 생성된 선점의 위치
        schema:
          type: string
        example: /api/v1/holds/h_8f3a21
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/json:
        schema:
          $ref: '#/schemas/HoldResponse'

  SeatConflict:
    description: |
      `409` — 선점 실패. **경합은 정상 결과다** — 서버는 이걸 `ERROR` 로 로깅하지 않는다
      (`operate.md` §1).
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/SeatConflictProblem'
        examples:
          alreadyHeld:
            summary: 남이 먼저 가짐 — `E-01`
            value:
              type: https://api.jomin4.cloud/problems/seat-conflict
              title: 좌석을 선점하지 못했습니다
              status: 409
              detail: 선택한 2석 중 1석을 다른 고객이 먼저 선점했습니다.
              instance: /api/v1/holds
              code: SEAT_ALREADY_HELD
              requestId: 7f3a9c21
              failedSeats:
                - { carNo: 4, rowNo: 7, colLetter: B, reason: HELD_BY_OTHER }
                - { carNo: 4, rowNo: 7, colLetter: A, reason: ALL_OR_NOTHING }
          lockTimeout:
            summary: 락 대기 초과 — "다시 시도"
            value:
              type: https://api.jomin4.cloud/problems/seat-lock-timeout
              title: 좌석이 처리 중입니다
              status: 409
              detail: 잠시 후 다시 시도해 주세요.
              instance: /api/v1/holds
              code: SEAT_LOCK_TIMEOUT
              requestId: 7f3a9c21

  BadHoldRequest:
    description: |
      `400` — **두 가지 `code` 가 온다.**

      | `code` | 언제 |
      |---|---|
      | `SEAT_COUNT_EXCEEDED` | 0석이거나 6석 초과. **버튼 비활성으로 미리 막는다** |
      | `VALIDATION_FAILED` | 그 밖의 형식 오류. `errors[]` 가 붙는다 |
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          oneOf:
            - $ref: './common.yaml#/schemas/Problem'
            - $ref: './common.yaml#/schemas/ValidationProblem'
        example:
          type: https://api.jomin4.cloud/problems/seat-count
          title: 좌석 수가 올바르지 않습니다
          status: 400
          detail: 한 번에 1~6석까지 선택할 수 있습니다.
          code: SEAT_COUNT_EXCEEDED
          requestId: 7f3a9c21

  HoldNotOwned:
    description: |
      `403` — 남의 선점이다.
      ⚠️ **`404` 가 아니다** — 존재는 하되 권한이 없다는 뜻을 그대로 준다 (`F-31`).
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: './common.yaml#/schemas/Problem'
        example:
          type: https://api.jomin4.cloud/problems/hold-not-owned
          title: 접근할 수 없는 선점입니다
          status: 403
          code: HOLD_NOT_OWNED
          requestId: 7f3a9c21

  HoldExpired:
    description: |
      `410` — 선점이 만료됐다.

      ⚠️ **DB 가 아직 `HELD` 여도 `410` 을 준다** (`data.md` §5.2 lazy 판정).
      만료 회수 스케줄러가 30초 주기라 최대 30초의 창이 생기는데, **이 판정이 그 창을 메운다.**

      화면은 **좌석 선택으로 되돌린다** (`E-02`). 만료된 선점을 되살리지 않는다.
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: './common.yaml#/schemas/Problem'
        example:
          type: https://api.jomin4.cloud/problems/hold-expired
          title: 선점 시간이 만료되었습니다
          status: 410
          detail: 좌석을 다시 선택해 주세요.
          code: HOLD_EXPIRED
          requestId: 7f3a9c21
