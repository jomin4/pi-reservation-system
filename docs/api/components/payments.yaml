# §5.3 결제 · 확정 — 2단계
# 근거: api.md §5.3 · §4.3 · data.md §3 (payment) · §5.3 (PM-1~PM-4) · §5.6
#
# 좌석은 경합이 문제였고 여기는 돈이 문제다.
# 계약이 막는 것 둘:  금액 위변조(order_id) · 이중 결제(Idempotency-Key)

schemas:

  OrderId:
    type: string
    description: |
      결제 주문 식별자 = **`payment.order_id`** (`data.md` §3).
      `ord_` + hex 8자리.

      ⚠️ **서버가 발급한다.** 클라이언트는 받은 값을 그대로 되돌려줄 뿐이다 —
      이 값으로 서버가 `payment` 행을 찾아 **금액을 대조**한다.
    pattern: '^ord_[0-9a-f]{8}$'
    example: ord_9c2f4a17

  PaymentIntentResponse:
    type: object
    description: |
      결제창에 넘길 값. **금액을 서버가 정한다** (전이 `PM-1`).

      > 클라이언트가 보낸 `amount` 를 그대로 믿으면 안 된다.
      > 그래서 이 단계에서 `payment` 행을 `REQUESTED` 로 미리 만든다.
    required: [orderId, amount, orderName]
    properties:
      orderId:
        $ref: '#/schemas/OrderId'
      amount:
        type: integer
        description: '**서버가 정한 금액.** 다음 단계에서 이 값과 대조한다'
        example: 119600
      orderName:
        type: string
        description: 토스 결제창에 표시될 문구
        example: KTX 101 · 4호차 7A 외 1석
    example:
      orderId: ord_9c2f4a17
      amount: 119600
      orderName: KTX 101 · 4호차 7A 외 1석

  PaymentConfirmRequest:
    type: object
    description: |
      토스 결제창이 돌려준 값을 그대로 서버에 넘긴다.

      ⚠️ **`amount` 를 보내지만 서버는 이걸 믿지 않는다.**
      `orderId` 로 찾은 `payment.amount` 와 **대조**하고, 다르면
      `400 PAYMENT_AMOUNT_MISMATCH` 다. 보내는 이유는 대조 대상이 필요해서다.
    required: [paymentKey, orderId, amount]
    properties:
      paymentKey:
        type: string
        description: 토스페이먼츠 `paymentKey`
        example: tviva20260904103254KDMbN
      orderId:
        $ref: '#/schemas/OrderId'
      amount:
        type: integer
        example: 119600

  PaymentPendingProblem:
    description: |
      **`202` 는 에러가 아니다.** 그런데 `Problem` 형태로 준다 —
      성공 응답과 형태가 달라야 클라이언트가 분기를 틀리지 않는다 (`api.md` §4.3).

      **200 도 5xx 도 아닌 세 번째 상태다.** 승인이 됐는지 서버도 아직 모른다
      (`data.md` §5.3 — `payment` 가 `REQUESTED` 에 머물러 있다).
    allOf:
      - $ref: './common.yaml#/schemas/Problem'

responses:

  PaymentIntentCreated:
    description: '`200` — 결제 세션 발급. 전이 **`PM-1`**'
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/json:
        schema:
          $ref: '#/schemas/PaymentIntentResponse'

  ReservationConfirmed:
    description: |
      `201` — **예약 확정.** 전이 **`TS-4`** + **`SH-2`** + **`RV-1`** + **`PM-2`**

      ⚠️ **이 시스템에서 가장 무거운 호출이다** — 5개 테이블이 한 트랜잭션에서 바뀐다
      (`data.md` §5.6).
    headers:
      Location:
        description: 생성된 예약의 위치
        schema:
          type: string
        example: /api/v1/reservations/48207315
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/json:
        schema:
          $ref: './reservations.yaml#/schemas/Reservation'

  PaymentPending:
    description: |
      `202` — **결과 미확정.** `PM-1` 유지.

      ⚠️ **클라이언트는 `GET /holds/{holdId}/payment` 로 폴링한다** (`E-03`).
      **다시 `POST` 하면 이중 결제다** — 화면에서 "다시 결제" 버튼을 잠근다.
    headers:
      Retry-After:
        description: 초. 이 시간 뒤에 `GET` 으로 조회한다
        schema:
          type: integer
        example: 2
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: '#/schemas/PaymentPendingProblem'
        example:
          type: https://api.jomin4.cloud/problems/payment-pending
          title: 결제 결과를 확인하는 중입니다
          status: 202
          detail: 잠시 후 결제 결과를 조회해 주세요.
          code: PAYMENT_PENDING
          requestId: 7f3a9c21

  PaymentDeclined:
    description: |
      `402` — 승인 거절. 전이 **`PM-3`**

      ⚠️ **선점은 유지된다.** 다른 수단으로 재시도할 수 있다 —
      좌석을 놓치게 만들 이유가 없다.
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: './common.yaml#/schemas/Problem'
        example:
          type: https://api.jomin4.cloud/problems/payment-declined
          title: 결제가 거절되었습니다
          status: 402
          detail: 다른 결제 수단으로 다시 시도해 주세요.
          code: PAYMENT_DECLINED
          requestId: 7f3a9c21

  BadPaymentRequest:
    description: |
      `400` — **두 가지 `code` 가 온다.**

      | `code` | 언제 |
      |---|---|
      | `PAYMENT_AMOUNT_MISMATCH` | `payment-intent` 가 못박은 금액과 다르다 |
      | `VALIDATION_FAILED` | 형식 오류. `errors[]` 가 붙는다 |
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          oneOf:
            - $ref: './common.yaml#/schemas/Problem'
            - $ref: './common.yaml#/schemas/ValidationProblem'
        example:
          type: https://api.jomin4.cloud/problems/payment-amount-mismatch
          title: 결제 금액이 일치하지 않습니다
          status: 400
          code: PAYMENT_AMOUNT_MISMATCH
          requestId: 7f3a9c21

  IdempotencyKeyReused:
    description: |
      `409` — **같은 `Idempotency-Key` 에 다른 본문**이 왔다.

      | 상황 | 결과 |
      |---|---|
      | 같은 키 · **같은 본문** | ✅ **이전 결과를 그대로 재생.** 새 승인을 안 한다 |
      | 같은 키 · **다른 본문** | ❌ 이 응답 |

      ⚠️ 이 에러가 나면 **클라이언트가 키를 잘못 쓰고 있다** —
      버튼을 누를 때마다 새로 만들었거나, 재시도에 다른 키를 붙였다 (`api.md` §2).
    headers:
      X-Request-Id:
        $ref: './common.yaml#/headers/XRequestId'
    content:
      application/problem+json:
        schema:
          $ref: './common.yaml#/schemas/Problem'
        example:
          type: https://api.jomin4.cloud/problems/idempotency-key-reused
          title: 중복된 결제 요청입니다
          status: 409
          code: IDEMPOTENCY_KEY_REUSED
          requestId: 7f3a9c21
